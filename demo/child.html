<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>内嵌编辑器</title>
    <style>
      body {
        margin: 0;
        padding: 14px;
        background: #fff;
        color: #111827;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 12.5px;
        color: #6b7280;
        font-weight: 600;
      }

      textarea {
        display: block;
        width: 100%;
        height: 96px;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        resize: none;
        font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .ce {
        margin-top: 8px;
        min-height: 56px;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      .tag {
        margin-top: 8px;
        font-size: 11px;
        color: #9ca3af;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h2>iframe 里的编辑器</h2>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="ce" id="ce" contenteditable="true" spellcheck="false"></div>
    <p class="tag" id="tag"></p>

    <script>
      (() => {
        const ta = document.getElementById('ta');
        const ce = document.getElementById('ce');
        document.getElementById('tag').textContent = location.href;

        window.__child = {
          ready: true,
          href: location.href,
          getValue: () => ta.value,
          setValue: (v) => {
            ta.value = v;
          },
          getCe: () => ce.innerText,
          setCe: (v) => {
            ce.textContent = v;
          }
        };
      })();
    </script>
  </body>
</html>
