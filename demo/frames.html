<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>贴进去 · iframe 演示</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #111827;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      .top {
        padding: 16px 22px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }

      .top p {
        margin: 0;
        max-width: 820px;
        font-size: 12.5px;
        color: #6b7280;
      }

      .wrap {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        padding: 16px 22px 28px;
      }

      @media (max-width: 900px) {
        .wrap {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
      }

      .head {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid #eef0f3;
        font-size: 12px;
      }

      .head code {
        color: #9ca3af;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      iframe {
        display: block;
        width: 100%;
        height: 300px;
        border: 0;
        background: #fff;
      }

      .foot {
        padding: 0 22px 26px;
        font-size: 12px;
        color: #6b7280;
      }

      .foot a {
        color: #2563eb;
        text-decoration: none;
        margin-right: 14px;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>iframe 演示：编辑器藏在子帧里</h1>
        <p>
          本页自身没有任何编辑器，两个输入框都在 iframe 内部。
          左边是同源子帧，右边默认是空白页——测试脚本会把它的 <code>src</code> 指向另一个端口，
          造出真正的跨域子帧。
        </p>
      </div>
    </header>

    <main class="wrap">
      <section class="panel">
        <div class="head"><b>同源内嵌</b><code>./child.html</code></div>
        <iframe id="same" src="./child.html" title="同源内嵌"></iframe>
      </section>

      <section class="panel">
        <div class="head"><b>跨域内嵌</b><code>另一个端口</code></div>
        <iframe id="cross" src="about:blank" title="跨域内嵌"></iframe>
      </section>
    </main>

    <div class="foot">
      <a href="./index.html">← 代码编辑器演示</a>
      <a href="./rich.html">富文本夹具 →</a>
    </div>

    <script>
      window.__frames = {
        ready: true,
        setCross(url) {
          document.getElementById('cross').src = url;
        },
        iframeCount: () => document.querySelectorAll('iframe').length
      };
    </script>
  </body>
</html>
